name: Hämta räntor

on:
  schedule:
    - cron: "17 3 * * *"   # varje natt 03:17 UTC
  workflow_dispatch:
    inputs:
      bank:
        description: "Bara en bank (id), tomt = alla"
        required: false
      force:
        description: "Tolka om även om källorna är oförändrade"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      RANTORNA_MODEL: ${{ vars.RANTORNA_MODEL || 'claude-sonnet-5-5' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installera
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Installera Claude CLI (om prenumerationstoken används)
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' && env.ANTHROPIC_API_KEY == '' }}
        run: npm install -g @anthropic-ai/claude-code

      - name: FI-registret (måndagar)
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            python -m collector.registry
          fi

      - name: Slå upp nya institut och varumärken
        run: python -m collector.resolve --limit 40

      - name: Hämta och tolka
        env:
          BANK: ${{ inputs.bank }}
          FORCE: ${{ inputs.force }}
        run: |
          args=""
          if [ -n "$BANK" ]; then args="$args --bank $BANK"; fi
          if [ "$FORCE" = "true" ]; then args="$args --force"; fi
          python -m collector.run --workers 4 $args

      - name: Barn och unga
        if: ${{ !inputs.bank }}
        run: python -m collector.run --segment youth --workers 4

      - name: Bolån – slå upp nya långivare
        if: ${{ !inputs.bank }}
        run: python -m collector.resolve --segment mortgage --limit 20

      - name: Bolån – hämta och tolka
        if: ${{ !inputs.bank }}
        run: python -m collector.run --segment mortgage --workers 4

      - name: Företag – slå upp nya banker
        if: ${{ !inputs.bank }}
        run: python -m collector.resolve --segment business_accounts --limit 20

      - name: Företag – konton
        if: ${{ !inputs.bank }}
        run: python -m collector.run --segment business_accounts --workers 4

      - name: Företag – sparande
        if: ${{ !inputs.bank }}
        run: python -m collector.run --segment business_savings --workers 4

      - name: Företag – finansiering
        if: ${{ !inputs.bank }}
        run: |
          RANTORNA_RESEARCH_MODEL=claude-haiku-5-5 python -m collector.resolve --segment business_financing --limit 10
          python -m collector.run --segment business_financing --workers 4

      - name: Privatlån
        if: ${{ !inputs.bank }}
        run: |
          RANTORNA_RESEARCH_MODEL=claude-haiku-5-5 python -m collector.resolve --segment personal_loans --limit 10
          python -m collector.run --segment personal_loans --workers 4

      - name: Kreditkort
        if: ${{ !inputs.bank }}
        run: |
          RANTORNA_RESEARCH_MODEL=claude-haiku-5-5 python -m collector.resolve --segment cards --limit 10
          python -m collector.run --segment cards --workers 4

      - name: Pension – slå upp nya bolag
        if: ${{ !inputs.bank }}
        run: python -m collector.resolve --segment pension --limit 10

      - name: Pension – hämta och tolka
        if: ${{ !inputs.bank }}
        run: python -m collector.run --segment pension --workers 4

      - name: Spara ändringar
        run: |
          git config user.name "rantorna-bot"
          git config user.email "rantorna-bot@users.noreply.github.com"
          python -m collector.check_data
          git add data/
          if git diff --cached --quiet; then
            echo "Inga ändringar."
          else
            git commit -m "Räntor $(date -u +%Y-%m-%d)"
            # Ränteläge-jobbet kan ha pushat under tiden – hämta och försök igen.
            for i in 1 2 3 4 5; do
              git pull --rebase -X theirs origin main && git push && exit 0
              sleep 20
            done
            exit 1
          fi
