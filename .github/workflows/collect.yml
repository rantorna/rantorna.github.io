name: Hämta räntor

on:
  # Startas varje natt 02:10 svensk tid av ett externt cron-jobb (workflow_dispatch), eftersom
  # GitHubs schema ofta släpar flera timmar. Schemat nedan är reserv och hoppar över sig självt
  # om natten redan är körd.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      bank:
        description: "Bara en bank (id), tomt = alla"
        required: false
      force:
        description: "Tolka om även om källorna är oförändrade"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Redan kört i natt?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d '20 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh run list -R "$GITHUB_REPOSITORY" -w collect.yml --created ">=$since" --json databaseId,conclusion \
              -q "[.[] | select(.databaseId != $GITHUB_RUN_ID and .conclusion == \"success\")] | length")
          echo "lyckade körningar sedan $since: $n"
          if [ "$n" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

  collect:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      RANTORNA_MODEL: ${{ vars.RANTORNA_MODEL || 'claude-haiku-5-5' }}
      # Uppslag med webbsökning: Haiku räcker och kostar en tjugondel
      RANTORNA_RESEARCH_MODEL: ${{ vars.RANTORNA_RESEARCH_MODEL || 'claude-haiku-5-5' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installera
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Installera Claude CLI (om prenumerationstoken används)
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' && env.ANTHROPIC_API_KEY == '' }}
        run: npm install -g @anthropic-ai/claude-code

      - name: FI-registret (måndagar)
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            python -m collector.registry
          fi

      - name: Slå upp nya institut och varumärken
        run: python -m collector.resolve --limit 40

      - name: Hämta och tolka
        env:
          BANK: ${{ inputs.bank }}
          FORCE: ${{ inputs.force }}
        run: |
          args=""
          if [ -n "$BANK" ]; then args="$args --bank $BANK"; fi
          if [ "$FORCE" = "true" ]; then args="$args --force"; fi
          python -m collector.run --workers 4 $args

      - name: Barn och unga
        if: ${{ !inputs.bank }}
        run: python -m collector.run --segment youth --workers 4

      - name: Sparkonton i utländsk valuta
        if: ${{ !inputs.bank }}
        run: python -m collector.run --segment fx_savings --workers 4

      - name: Bolån – slå upp nya långivare
        if: ${{ !inputs.bank }}
        run: python -m collector.resolve --segment mortgage --limit 20

      - name: Bolån – hämta och tolka
        if: ${{ !inputs.bank }}
        run: python -m collector.run --segment mortgage --workers 4

      - name: Företag – slå upp nya banker
        if: ${{ !inputs.bank }}
        run: python -m collector.resolve --segment business_accounts --limit 20

      - name: Företag – konton
        if: ${{ !inputs.bank }}
        run: python -m collector.run --segment business_accounts --workers 4

      - name: Företag – sparande
        if: ${{ !inputs.bank }}
        run: python -m collector.run --segment business_savings --workers 4

      - name: Företag – finansiering
        if: ${{ !inputs.bank }}
        run: |
          python -m collector.resolve --segment business_financing --limit 10
          python -m collector.run --segment business_financing --workers 4

      - name: Privatlån
        if: ${{ !inputs.bank }}
        run: |
          python -m collector.resolve --segment personal_loans --limit 10
          python -m collector.run --segment personal_loans --workers 4

      - name: Kreditkort
        if: ${{ !inputs.bank }}
        run: |
          python -m collector.resolve --segment cards --limit 10
          python -m collector.run --segment cards --workers 4

      - name: Utlandsbetalningar
        if: ${{ !inputs.bank }}
        run: |
          python -m collector.resolve --segment transfers --limit 10
          python -m collector.run --segment transfers --workers 4

      - name: Utlandsbetalningar för företag
        if: ${{ !inputs.bank }}
        run: |
          python -m collector.resolve --segment business_transfers --limit 5
          python -m collector.run --segment business_transfers --workers 4

      - name: Valutaväxling i depån
        if: ${{ !inputs.bank }}
        run: |
          python -m collector.resolve --segment broker_fx --limit 5
          python -m collector.run --segment broker_fx --workers 4

      - name: Bankkort utomlands
        if: ${{ !inputs.bank }}
        run: |
          python -m collector.resolve --segment debit_cards --limit 5
          python -m collector.run --segment debit_cards --workers 4

      - name: Växlingskontorens kurser
        if: ${{ !inputs.bank }}
        run: python -m collector.cash

      - name: Pension – slå upp nya bolag
        if: ${{ !inputs.bank }}
        run: python -m collector.resolve --segment pension --limit 10

      - name: Pension – hämta och tolka
        if: ${{ !inputs.bank }}
        run: python -m collector.run --segment pension --workers 4

      - name: Spara ändringar
        run: |
          git config user.name "rantorna-bot"
          git config user.email "rantorna-bot@users.noreply.github.com"
          python -m collector.check_data
          git add data/
          if git diff --cached --quiet; then
            echo "Inga ändringar."
          else
            git commit -m "Räntor $(date -u +%Y-%m-%d)"
            # Ränteläge-jobbet kan ha pushat under tiden – hämta och försök igen.
            for i in 1 2 3 4 5; do
              git pull --rebase -X theirs origin main && git push && exit 0
              sleep 20
            done
            exit 1
          fi
